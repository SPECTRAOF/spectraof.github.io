<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unsubscribe | SPECTRA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070b0f;
      color: #f4f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
      padding: 40px 24px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #ffffff;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #6f7d88;
    }

    .accent {
      width: 42px;
      height: 2px;
      margin-top: 48px;
      background: #1597ff;
    }

    h1 {
      margin: 28px 0 0;
      font-size: 42px;
      line-height: 1.08;
      letter-spacing: -1px;
    }

    .message {
      margin-top: 28px;
      max-width: 540px;
      font-size: 16px;
      line-height: 1.7;
      color: #aab5bd;
    }

    .status {
      margin-top: 34px;
      font-size: 13px;
      line-height: 1.6;
      color: #81909c;
    }

    .back {
      display: inline-block;
      margin-top: 34px;
      padding: 14px 22px;
      border-radius: 3px;
      background: #1597ff;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid #1b252d;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #6f7d88;
    }

    .footer-note {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.6;
      color: #46525b;
    }

    @media (max-width: 600px) {
      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 34px;
      }

      .message {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">SPECTRA</div>

    <div class="subtitle">
      ORDER FLOW PLATFORM
    </div>

    <div class="accent"></div>

    <h1 id="title">
      Unsubscribe
    </h1>

    <p class="message" id="message">
      Removing you from the SPECTRA waitlist.
    </p>

    <div class="status" id="status">
      Please wait...
    </div>

    <a
      class="back"
      id="back"
      href="https://spectraof.com"
      style="display:none;"
    >
      BACK TO SPECTRA&nbsp; ↗
    </a>

    <footer class="footer">

      <div class="tagline">
        FROM TRADERS, FOR TRADERS.
      </div>

      <div class="footer-note">
        You can join the SPECTRA waitlist again at any time.
      </div>

    </footer>

  </main>

  <script>
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const back = document.getElementById("back");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    async function unsubscribe() {
      if (!token) {
        title.textContent = "Invalid link.";
        message.textContent =
          "This unsubscribe link is missing the required token.";
        status.textContent = "";
        back.style.display = "inline-block";
        return;
      }

      try {
        const response = await fetch(
          "https://spectra-waitlist.spectraof-ceo.workers.dev",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              action: "unsubscribe",
              token: token
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message || "Something went wrong."
          );
        }

        title.textContent = "You're unsubscribed.";

        message.textContent =
          "Your email has been removed from the SPECTRA waitlist.";

        status.textContent =
          "You will no longer receive SPECTRA waitlist updates.";

        back.style.display = "inline-block";

      } catch (error) {
        title.textContent = "Something went wrong.";

        message.textContent =
          "We couldn't process your unsubscribe request.";

        status.textContent =
          "Please try again later.";

        back.style.display = "inline-block";
      }
    }

    unsubscribe();
  </script>

</body>
</html>
